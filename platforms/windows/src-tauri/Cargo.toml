[package]
name = "aegis-desktop"
version = "0.1.0"
description = "AEGIS emergency simulation command center desktop wrapper"
authors = ["Team X - CodeFusion EIT Hackathon"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
